<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Workout Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Phone-first dark UI (approved mockup): one column, bottom tab bar, bottom sheet for filters, full-screen timer. */
:root {
  --bg: #0f1115; --s1: #181b22; --s2: #21252e; --line: #2c313c; --line2: #3a404c;
  --fg: #eef0f3; --muted: #aab0bb; --faint: #8b929e; --accent: #8ab0ff; --on-accent: #0c1222;
  --rest-row: #0f2624; --rest-line: #1d4440; --rest-ink: #7fe0d3;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; }

/* ---------- library ---------- */
.lib-head { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 12px 16px 0; }
.titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.titlerow h1 { margin: 0; font-size: 26px; line-height: 32px; font-weight: 800; letter-spacing: -.02em; }
.titlerow span { font-size: 13px; color: var(--muted); }
.search { position: relative; margin-top: 10px; }
.search svg { position: absolute; left: 14px; top: 13px; color: var(--faint); pointer-events: none; }
.search input { display: block; width: 100%; height: 44px; padding: 0 14px 0 42px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--s1); outline: none; font-size: 15px; }
.chiprow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 16px 0; margin: 0 -16px; }
.chiprow::-webkit-scrollbar { display: none; }
.pill { flex: none; height: 44px; padding: 0 12px 0 14px; border-radius: 22px; border: 1px solid var(--line2); background: transparent;
  font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.pill.sel { border-color: #5677c0; background: #1c2538; color: #dbe5ff; }
.pill.strong { background: var(--s2); font-weight: 700; }
.badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--accent); color: var(--on-accent);
  font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.subrow { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 4px; margin: 0 -8px; }
.subrow button, .subrow a { height: 44px; padding: 0 8px; border: 0; background: none; display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; text-decoration: none; }
.subrow svg.dim { color: var(--muted); }
.sortsel { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--fg); }
.sortsel svg { color: var(--muted); }
.sortsel select { appearance: none; -webkit-appearance: none; height: 44px; border: 0; background: transparent; color: var(--fg);
  font-size: 13px; font-weight: 600; padding: 0 2px; cursor: pointer; }
.sortsel select option { background: var(--s1); color: var(--fg); }
.list { list-style: none; margin: 0; padding: 0 0 88px; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 16px; text-decoration: none; color: var(--fg); }
.row:active { background: var(--s1); }
.tile { flex: none; width: 64px; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 5px; font-size: 10px; line-height: 12px; font-weight: 800; letter-spacing: .03em; }
.rbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.rtop { display: flex; gap: 10px; align-items: flex-start; }
.rname { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.rmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; line-height: 18px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--s2);
  color: #cfd4dc; font-size: 12px; font-weight: 600; }
.dots { flex: none; display: inline-flex; gap: 3px; padding-top: 7px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px #6b7280; }
.dots.big i { width: 7px; height: 7px; border-radius: 4px; }
.empty { padding: 24px 16px; color: var(--muted); }
.credit { padding: 8px 16px 0; color: var(--faint); font-size: 12px; }
.credit a { color: var(--muted); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid #22262f;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 520px; margin: 0 auto; height: 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
.tabbar button span { width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar button[aria-current="page"] span { background: #1c2538; }

/* ---------- filters sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 8; background: rgba(5, 6, 8, .74); }
.sheet { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; top: 44px; max-width: 520px; margin: 0 auto; background: var(--s1);
  border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
.grab { flex: none; display: flex; justify-content: center; padding-top: 8px; }
.grab i { width: 40px; height: 5px; border-radius: 3px; background: #4a505c; }
.sheet-head { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 16px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.fs-label { margin: 0 0 6px; font-size: 15px; line-height: 18px; font-weight: 700; }
.seg { display: grid; gap: 6px; }
.opt { height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--s2); font-size: 14px;
  font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 800; }
.opt .sw { width: 10px; height: 10px; border-radius: 3px; }
.opt.stack { flex-direction: column; gap: 3px; font-size: 13px; line-height: 16px; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.wrap .opt { flex: 1 1 auto; }
.switchrow { display: flex; align-items: center; gap: 12px; min-height: 48px; border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.switchrow .txt { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.switchrow .txt b { font-size: 15px; } .switchrow .txt span { font-size: 13px; color: var(--muted); }
.switch { flex: none; width: 52px; height: 32px; border-radius: 16px; background: var(--line2); position: relative; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: var(--fg); transition: left .15s; }
.switchrow[aria-checked="true"] .switch { background: var(--accent); }
.switchrow[aria-checked="true"] .switch::after { left: 23px; background: var(--on-accent); }
.gear { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 10px; }
.gear h3 { height: 22px; margin: 0; display: flex; align-items: flex-end; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.gear label { min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.gear input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.sheet-foot { flex: none; display: flex; gap: 10px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.btn { height: 52px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--line2); background: transparent; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--fg); }
.btn.primary { flex: 1; border: 0; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 800; }
.btn .sub { font-size: 14px; font-weight: 600; color: #26344f; }

/* ---------- class page ---------- */
.band { position: sticky; top: 0; z-index: 3; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px;
  font-size: 13px; font-weight: 800; letter-spacing: .1em; }
.band .back { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: inherit;
  background: rgba(0, 0, 0, .12); }
.chead { padding: 14px 16px 0; }
.eyebrow { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chead h1 { margin: 2px 0 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.chips { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { height: 26px; padding: 0 10px; border-radius: 8px; background: var(--s2); border: 1px solid var(--line2); font-size: 12px;
  font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.chip .dots { padding-top: 0; }
.cmeta { margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }
.cmeta b { color: var(--fg); font-weight: 600; }
.notes { margin: 10px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }
.lengths { margin-top: 12px; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
.lengths::-webkit-scrollbar { display: none; }
.lengths .lab { flex: none; font-size: 11px; line-height: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.lengths a, .lengths span.cur { flex: none; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line);
  color: var(--fg); display: flex; align-items: center; gap: 6px; font-size: 13px; text-decoration: none; white-space: nowrap; }
.lengths span.cur { background: #1c2538; border-color: #5677c0; color: #dbe5ff; }
.lengths b { font-weight: 800; } .lengths a span { color: var(--muted); }
.routine-h { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; height: 44px; margin-top: 6px; }
.routine-h h2 { margin: 0; font-size: 17px; font-weight: 800; }
.grp { margin: 0; padding: 8px 16px 2px; font-size: 11px; line-height: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.steps { list-style: none; margin: 0; padding: 0; }
.ex { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 2px 4px 2px 16px; }
.ex .ph { flex: none; width: 40px; height: 40px; border-radius: 8px; background: var(--s2); border: 1px solid var(--line); overflow: hidden;
  display: flex; align-items: center; justify-content: center; color: var(--faint); }
.ex .ph img { width: 100%; height: 100%; object-fit: cover; }
.ex .nm { flex: 1; min-width: 0; }
.ex .nm b { display: block; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex .nm span { display: block; font-size: 12px; line-height: 16px; color: var(--muted); }
.ex .amt { flex: none; font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.yt { flex: none; width: 48px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
.restrow { margin: 4px 16px; min-height: 36px; border-radius: 10px; background: var(--rest-row); border: 1px solid var(--rest-line);
  display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--rest-ink); font-size: 14px; font-weight: 700; }
.startbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--bg); border-top: 1px solid var(--line);
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.startbar .in { max-width: 488px; margin: 0 auto; display: flex; }
.cpage { padding-bottom: 96px; }

/* ---------- timer ---------- */
.player { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; overflow: hidden; background: var(--tint); color: var(--fg);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --ph: #e0484e; --ph-ink: #170809; --tint: #2b1618; --surf: #3a2124; --surf2: #3d2326; --pline: #6a3c41; --pmuted: #d6c8c9; --track: #47262a; }
.player.prep { --ph: #f7b538; --ph-ink: #1a1204; --tint: #2a2213; --surf: #3a3020; --surf2: #3d321c; --pline: #6b5830; --pmuted: #ddd3bf; --track: #4a3c1f; }
.player.rest { --ph: #22ad9c; --ph-ink: #04140f; --tint: #0f2624; --surf: #16352f; --surf2: #1a3c37; --pline: #2f6a62; --pmuted: #b9e3dc; --track: #1d4440; }
.player.done { --ph: #8ab0ff; --ph-ink: #0c1222; --tint: #0f1115; --surf: #181b22; --surf2: #21252e; --pline: #3a404c; --pmuted: #aab0bb; --track: #2c313c; }
.p-in { flex: 1; min-height: 0; width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
.p-head { flex: none; height: 60px; padding: 8px 16px 0; display: flex; align-items: center; gap: 8px; }
.p-head .x { width: 48px; height: 48px; border-radius: 24px; border: 0; background: var(--surf2); display: flex; align-items: center; justify-content: center; }
.p-title { flex: 1; min-width: 0; text-align: center; }
.p-title b { display: block; font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-title span { font-size: 13px; line-height: 18px; color: var(--pmuted); }
.p-left { flex: none; width: 60px; text-align: right; }
.p-left b { display: block; font-size: 17px; line-height: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.p-left span { font-size: 11px; color: var(--pmuted); font-weight: 600; }
.p-prog { flex: none; margin: 10px 16px 0; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.p-prog i { display: block; height: 100%; width: 0; background: var(--fg); }
.p-banner { flex: none; margin: 12px 16px 0; height: 52px; border-radius: 14px; background: var(--ph); color: var(--ph-ink);
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.p-banner .lbl { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; letter-spacing: .12em; }
.p-banner .dur { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ring { flex: none; position: relative; width: 210px; height: 210px; margin: 12px auto 0; }
.ring svg { display: block; }
.ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .clock { font-size: 120px; line-height: .92; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: #fff; }
.ring .of { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--pmuted); }
.ring .pips { display: none; gap: 10px; margin-top: 8px; }
.ring .pips i { width: 12px; height: 12px; border-radius: 6px; background: #fff; opacity: .25; }
.ring .pips i.on { opacity: 1; }
.player.final .ring .pips { display: flex; } .player.final .ring .of { display: none; }
.player.final .ring .clock { font-size: 140px; }
.flash { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.flash.go { animation: edge .45s ease-out; }
@keyframes edge { from { box-shadow: inset 0 0 0 8px var(--ph); } to { box-shadow: inset 0 0 0 0 var(--ph); } }
@media (prefers-reduced-motion: reduce) { .flash.go { animation: none; } .player.final { box-shadow: inset 0 0 0 4px var(--ph); } }
.p-up { flex: none; margin-top: 8px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--pmuted); }
.p-name { flex: none; margin: 6px 16px 0; text-align: center; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.p-sub { flex: none; min-height: 18px; text-align: center; font-size: 14px; color: var(--pmuted); }
.p-media { flex: 1 1 0px; min-height: 72px; max-height: 150px; position: relative; margin: 10px 16px 0; border-radius: 14px; background: var(--surf);
  border: 1px solid var(--pline); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--pmuted); }
.p-media img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.p-media .yt { position: absolute; right: 6px; bottom: 6px; background: rgba(0, 0, 0, .55); }
.p-cue { flex: none; margin: 6px 16px 0; font-size: 13px; line-height: 17px; text-align: center; color: var(--pmuted); }
.p-next { flex: none; margin: 10px 16px 0; min-height: 48px; border-radius: 14px; background: var(--surf); display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.p-next .k { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--pmuted); }
.p-next b { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-next span { flex: none; font-size: 13px; font-weight: 600; color: var(--pmuted); }
.p-toggles { flex: none; margin: 10px 16px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tg { height: 54px; padding: 0 2px; border-radius: 12px; border: 1px solid var(--pline); background: transparent; color: var(--pmuted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; }
.tg[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: #111318; }
.p-ctl { flex: none; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 12px 16px 18px; }
.p-ctl button { width: 64px; height: 64px; border-radius: 32px; border: 0; background: var(--surf2); display: flex; align-items: center; justify-content: center; }
.p-ctl button.main { width: 88px; height: 88px; border-radius: 44px; background: #f4f5f7; color: #111318; }
.p-ctl button:disabled { opacity: .35; }
.p-done { display: none; }
.player.done .p-done { display: flex; } .player.done .p-live { display: none; }
.p-done { flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 16px; text-align: center; }
.p-done h2 { margin: 0; font-size: 28px; font-weight: 800; }
.p-done p { margin: 0; color: var(--muted); }
.p-live { flex: 1; min-height: 0; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="app" id="view"></div>
<div id="layer"></div>
<script src="routines.js"></script>
<script>
(() => {
const R = window.ROUTINES || [];
const byId = Object.fromEntries(R.map(r => [r.id, r]));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
const mins = r => Math.round((r.dur || 0) / 60);
const thumb = (r, f) => f ? `../data/thumbs/${r.id}/${f}` : '';
// pictures for a step: our own video frame (local copy) or the public-domain catalogue photos (public site)
const imgsOf = (r, s) => s && s.th ? [thumb(r, s.th)] : (s && s.img) || [];
const ytAt = (r, s) => s && s.v != null ? `https://www.youtube.com/watch?v=${r.id}&t=${s.v}s` : r.url;
const PUBLIC = R.some(r => r.steps.some(s => s.img));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const TG0 = { role: 'Workout', goal: '', intensity: 0, focus: '', gear: [], quiet: false, similar: [] };
const tg = r => r.tg || TG0;
const timerTotal = r => r.steps.reduce((x, s) => x + (s.p || 0) + s.w, 0);

/* ---------- icons (inline stroke SVG) ---------- */
const P_ = {

/* ---------- class types and difficulty ---------- */
const STRETCH = { bg: '#245582', fg: '#ffffff', label: 'STRETCH', icon: 'wind' };
const TYPES = {
  'Strength & toning': { bg: '#7a4bd8', fg: '#ffffff', label: 'STRENGTH', icon: 'dumbbell' },
  'Fat-burn circuit': { bg: '#d454c6', fg: '#1c0619', label: 'BURN', icon: 'flame', long: 'FAT-BURN CIRCUIT' },

  'Warm-up': { bg: '#f4a3c4', fg: '#2a0d1a', label: 'WARM-UP', icon: 'sunrise' },
  'Mobility': STRETCH, 'Stretching': STRETCH,
};
const typeOf = r => TYPES[tg(r).goal] || { bg: '#3a404c', fg: '#eef0f3', label: 'CLASS', icon: 'dumbbell' };
const DIFF = ['', '#a3e8c0', '#eaae3e', '#e8843a', '#dc5a34', '#c42a3c'];

/* ---------- filters ---------- */
// session order: warm up → work out → cool down (Workouts stays the default tab, in the middle)
const TABS = [['Warm-up', 'Warm-ups', 'sunrise'], ['Workout', 'Workouts', 'dumbbell'], ['Cool-down & mobility', 'Cool-down', 'wind']];
const GEAR_GROUPS = [['Household', ['chair/box', 'towel', 'paper rolls', 'sliders']],
                     ['Light gear', ['band', 'fitball', 'foam roller']],
                     ['Weights', ['dumbbells', 'kettlebell', 'barbell']]];
const GOALS = ['Any', 'Strength & toning', 'Fat-burn circuit', 'HIIT', 'Tabata'];
const FITS = { Any: 1e9, '≤10′': 10.5, '≤20′': 20.5, '≤30′': 30.5, '≤40′': 40.5 };
const INTEN = { Any: [0, 5], 'Easy 1–2': [1, 2], 'Moderate 3': [3, 3], 'Hard 4–5': [4, 5] };
const FOCUS = { Any: null, Core: ['Core'], 'Legs & glutes': ['Legs', 'Glutes'] };
const DEF = { goal: 'Any', fits: 'Any', quiet: false, inten: 'Any', focus: 'Any' };
const state = {
  tab: store.get('f_tab', 'Workout'), q: '', sort: store.get('f_sort', 'len'),
  goal: store.get('f_goal', 'Any'), fits: store.get('f_fits', 'Any'), quiet: store.get('f_quiet', false),
  inten: store.get('f_inten', 'Any'), focus: store.get('f_focus', 'Any'),
  gear: new Set(store.get('f_gear', ['chair/box', 'towel', 'paper rolls', 'sliders'])),
};
if (!TABS.some(t => t[0] === state.tab)) state.tab = 'Workout';
if (!(state.fits in FITS)) state.fits = 'Any'; if (!GOALS.includes(state.goal)) state.goal = 'Any';
if (!(state.inten in INTEN)) state.inten = 'Any'; if (!(state.focus in FOCUS)) state.focus = 'Any';
const setF = (k, v) => { state[k] = v; store.set('f_' + k, v); };

const hasGear = r => tg(r).gear.every(g => state.gear.has(g));
function baseMatch(r) {                      // everything except the gear limit
  const t = tg(r);
  if (state.q) {
    const hay = (r.name + ' ' + r.pl + ' ' + t.goal + ' ' + r.steps.map(s => s.n || '').join(' ')).toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  if (t.role !== state.tab) return false;
  if (mins(r) > FITS[state.fits]) return false;
  if (state.quiet && !t.quiet) return false;
  if (state.tab === 'Workout') {
    if (state.goal !== 'Any' && t.goal !== state.goal) return false;
    const [a, b] = INTEN[state.inten]; if (state.inten !== 'Any' && !(t.intensity >= a && t.intensity <= b)) return false;
    const f = FOCUS[state.focus]; if (f && !f.includes(t.focus)) return false;
  }
  return true;
}
const diffOr = (r, none) => tg(r).intensity || none;   // unrated classes go last either way
const SORTS = {
  len:  ['Shortest first', (a, b) => a.dur - b.dur],
  easy: ['Easiest first', (a, b) => (diffOr(a, 9) - diffOr(b, 9)) || a.dur - b.dur],
  hard: ['Hardest first', (a, b) => (diffOr(b, 0) - diffOr(a, 0)) || a.dur - b.dur],
  az:   ['A–Z', (a, b) => a.name.localeCompare(b.name, 'es')],
};
if (!(state.sort in SORTS)) state.sort = 'len';
function results() {
  const base = R.filter(baseMatch), list = base.filter(hasGear);
  list.sort(SORTS[state.sort][1]);
  return { list, hidden: base.length - list.length };
}
const activeFilters = () => (state.fits !== 'Any') + state.quiet +
  (state.tab === 'Workout' ? (state.goal !== 'Any') + (state.inten !== 'Any') + (state.focus !== 'Any') : 0);

/* ---------- library ---------- */
function rowHTML(r) {

  const badges = (t.quiet ? `<span class="tag">${ic('feather', 12, 2.2)}Quiet</span>` : '') +
    t.gear.map(g => `<span class="tag">${ic('kettle', 12, 2.2)}${esc(g)}</span>`).join('') + (r.na ? '<span class="tag">unavailable</span>' : '');
  return `<li><a class="row" href="#/r/${r.id}">
    <span class="tile" aria-hidden="true" style="background:${ty.bg};color:${ty.fg}">${ic(ty.icon, 24, 2.4)}<span>${ty.label}</span></span>
    <span class="rbody"><span class="rtop"><span class="rname">${esc(r.name)}</span>${dots(t.intensity)}</span>
    <span class="rmeta"><span>${mins(r)} min · ${esc(t.goal || r.pl)}</span>${badges}</span></span></a></li>`;
}
let libShellTab = null;
function library() {
  const tabName = (TABS.find(t => t[0] === state.tab) || TABS[0])[1];
  if (libShellTab !== state.tab || !$('#libhead')) {
    libShellTab = state.tab;
    $('#view').innerHTML = `<header class="lib-head" id="libhead">
      <div class="titlerow"><h1>${tabName}</h1><span id="count"></span></div>
      <div class="search">${ic('search', 18)}<input id="q" type="search" aria-label="Search classes or exercises" placeholder="Search classes or exercises" autocomplete="off"></div>
      <div class="chiprow" role="group" aria-label="Limits and filters" id="chips"></div>
      <div class="subrow"><label class="sortsel">${ic('sort', 16)}<select id="sort" aria-label="Sort classes">${Object.entries(SORTS).map(([k, [l]]) =>
        `<option value="${k}">${l}</option>`).join('')}</select>${ic('down', 14)}</label><a href="#/filters/gear" id="hiddenlink" hidden></a></div>
    </header><ul class="list" id="list" aria-label="Classes"></ul>
    <p class="credit">Routines transcribed from the free <a href="https://www.youtube.com/channel/UCjYhS8nd7ETpwRrY69QudMg" target="_blank" rel="noopener">Trainingym</a> YouTube classes (not affiliated); the YouTube button opens the original video at that exercise.${PUBLIC ? ' Exercise photos: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> (public domain), shown only where the movement matches.' : ''}</p>`;
    const q = $('#q'); q.value = state.q;

    $('#sort').onchange = e => { setF('sort', e.target.value); refresh(); window.scrollTo(0, 0); };

function refresh() {
  const { list, hidden } = results(), n = activeFilters();
  $('#count').textContent = `${list.length} ${list.length === 1 ? 'class' : 'classes'}`;
  $('#chips').innerHTML = `
    <button type="button" class="pill strong" onclick="location.hash='#/filters'" aria-label="Filters${n ? `, ${n} active` : ''}">${ic('sliders', 18)}<span>Filters</span>${n ? `<span class="badge" aria-hidden="true">${n}</span>` : ''}</button>
    <button type="button" class="pill sel" onclick="location.hash='#/filters/gear'">${ic('kettle', 18)}<span>My gear · ${state.gear.size}</span>${ic('down', 16)}</button>

    <button type="button" class="pill${state.quiet ? ' sel' : ''}" id="quietpill" aria-pressed="${state.quiet}">${ic('feather', 18)}<span>Quiet</span></button>`;
  $('#quietpill').onclick = () => { setF('quiet', !state.quiet); refresh(); };
  $('#sort').value = state.sort;
  const hl = $('#hiddenlink'); hl.hidden = !hidden; hl.innerHTML = `${ic('hidden', 16)}<span>${hidden} hidden — change gear</span>`;
  $('#list').innerHTML = list.length ? list.map(rowHTML).join('') :

}
function tabbar(on) {
  let el = $('#tabbar');
  if (!on) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('nav'); el.className = 'tabbar'; el.id = 'tabbar'; el.setAttribute('aria-label', 'Sections'); document.body.appendChild(el); }
  el.innerHTML = `<div class="in">${TABS.map(([k, l, i]) => `<button type="button" data-tab="${esc(k)}"${!state.q && state.tab === k ? ' aria-current="page"' : ''}><span>${ic(i, 22)}</span>${l}</button>`).join('')}</div>`;
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    setF('tab', b.dataset.tab); state.q = ''; window.scrollTo(0, 0);
    if (location.hash.length > 2) location.hash = '#/'; else library();

/* ---------- class page ---------- */
function detail(id) {

  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(e => e[0])[0];
  const follow = r.src && !/OCR/.test(r.src);
  const meta2 = follow ? `Follow-along${r.eq ? ` · equipment: <b>${esc(r.eq)}</b>` : ''}` :
    [top(works) && `Work <b>${top(works)}s</b>`, top(preps) > 0 && `Transition <b>${top(preps)}s</b>`,
     rests.size && `Rests <b>${[...rests].sort((a, b) => a - b).map(x => x + 's').join(', ')}</b>`].filter(Boolean).join(' · ');
  const sim = [r, ...(t.similar || []).map(i => byId[i]).filter(Boolean)].sort((a, b) => a.dur - b.dur);
  let lastRound = null, body = '', rowsOpen = false;

    open();
    if (s.k === 'rest') { body += `<li class="restrow">${ic('restc', 18)}<span>Rest ${s.w}s</span></li>`; return; }
    const pic = imgsOf(r, s)[0];
    body += `<li class="ex"><span class="ph" aria-hidden="true">${pic ? `<img loading="lazy" src="${pic}" alt="">` : ic('person', 20, 1.6)}</span>
      <span class="nm"><b>${esc(s.n)}${s.sd ? ` <span style="display:inline;color:var(--muted);font-weight:400">(${esc(s.sd)})</span>` : ''}</b>${s.c ? `<span>${esc(s.c)}</span>` : ''}</span>
      <span class="amt">${s.r ? '×' + s.r : s.w + 's'}</span>${ytLink(r, s)}</li>`;
  });

      <div class="chips">${t.intensity ? `<span class="chip">${dots(t.intensity, true)}<b style="font-size:12px">${DIFF_WORD[t.intensity]}</b></span>` : ''}
        ${t.focus ? `<span class="chip">${esc(t.focus)}</span>` : ''}${t.quiet ? `<span class="chip">${ic('feather', 14)}Quiet</span>` : ''}

function onMedia(e) {                   // the backend is the truth: own calls, notification controls, audio-focus loss
  if (!P || !P.url) return;
  const run = isPlaying();
  if (run !== P.running) { P.running = run; loop(run); }
  frame(); msUpdate();
  if (e === 'ended') say('Workout complete. Great job!');
}
function setPlaying(on) {               // ▶/⏸, space key, notification play/pause
  if (!P || on === P.running || (on && P.done)) return;
  if (on) {
    if (!P.url) try { loadTrack(P.pos); } catch { return; }   // first ▶ of the run: prepare inside the gesture
    P.running = true; playTrack();
    if (opts.voice && !voiceOK) announce();                     // Chrome only speaks after a user gesture
  } else { P.running = false; pauseTrack(); }
  loop(P.running); frame(); msUpdate();
}
function toggle() { if (P) setPlaying(!P.running); }
function jump(d) {                      // seek to a phase start; its start sound (GO / chime) is in the schedule
  if (!P) return;
  seek(target(Math.min(Math.max(0, P.k + d), P.ph.length - 1)));
  P.k = -1; frame(); msUpdate();        // re-derived from the clock; announces the phase landed on
}
function retrack(pos) {                 // timeline changed, Sound toggled or backend switched: rebuild and go on at pos
  unbuzz(true);
  if (P.url) { loadTrack(pos); if (P.running) playTrack(); } else { P.pos = pos; P.mode = opts.mix ? 'web' : 'media'; }
  P.k = phaseAt(pos); frame(); msUpdate();
}
function frame() {                      // phase + seconds left come from the backend clock; interval/events only redraw
  if (!P) return;
  const t = clock(), was = P.k, k = phaseAt(t);
  P.k = k; P.done = t >= P.total - 1e-3;
  P.left = P.done ? 0 : Math.min(P.ph[k].dur, P.starts[k] + P.ph[k].dur - t);
  if (k !== was) { if (t - P.starts[k] < 2) announce(); msUpdate(); }
  if (P.running) buzz(t);
  if (document.visibilityState === 'visible') render();
}
function nextEx(k) { const c = P.ph[k]; for (let j = k + 1; j < P.ph.length; j++) { const p = P.ph[j];
  if (p.type === 'work' && (p.ci !== c.ci || p.i !== c.i)) return p; } return null; }
function announce() {
  const p = P.ph[P.k], s = p.step;
  if (p.newClass) say('Next class: ' + p.r.name + '. First: ' + s.n);
  else if (p.type === 'prep') say('Next: ' + s.n + (s.sd ? ', ' + s.sd.replace('?', '') : '') + (s.r ? ', ' + s.r + ' reps' : ''));
  else if (p.type === 'rest') say('Rest ' + p.dur + ' seconds');
  else if (p.type === 'work' && (opts.skipNext || !(P.k > 0 && P.ph[P.k - 1].i === p.i && P.ph[P.k - 1].ci === p.ci))) say(s.n);
}
function render() {
  if (!P) return;
  const el = $('#player'), p = P.ph[P.k], s = p.step, r = p.r;
  const ph = P.done ? 'done' : p.type, left = Math.max(0, Math.ceil(P.left)), fin = !P.done && left >= 1 && left <= 3 && p.dur > 3;
  el.className = 'player ' + ph + (fin ? ' final' : '');
  const exAll = r.steps.filter(x => x.k === 'ex'), exIdx = r.steps.filter((x, j) => x.k === 'ex' && j <= p.i).length;
  $('#pcls').textContent = r.name;
  $('#psub').textContent = (s.rd ? `Round ${s.rd} · ` : '') + (p.type === 'rest' ? `After exercise ${exIdx} / ${exAll.length}` : `Exercise ${exIdx} / ${exAll.length}`);
  const remain = P.ph.slice(P.k + 1).reduce((t, x) => t + x.dur, 0) + Math.max(0, P.left);
  $('#pt').textContent = fmt(remain);
  $('#pbar').style.width = (100 * (1 - remain / P.total)) + '%';
  if (P.done) { $('#pdonetxt').textContent = `${r.name} · ${fmt(P.total)}`; drawPlayBtn(); return; }
  const banner = { work: ['bolt', 'WORK'], prep: ['stopwatch', p.newClass ? 'NEXT CLASS' : 'GET READY'], rest: ['restc', 'REST'] }[p.type];
  $('#plbl').innerHTML = ic(banner[0], 22, 2.4) + banner[1];
  $('#pdur').textContent = p.dur + 's';
  $('#parc').setAttribute('stroke-dasharray', `${(641 * Math.max(0, P.left) / p.dur).toFixed(1)} 641`);
  $('#pclock').textContent = String(left);
  $('#ptimer').setAttribute('aria-label', `${left} seconds left`);
  $('#pof').textContent = `of ${p.dur}s`;
  $('#ppips').querySelectorAll('i').forEach((pip, i) => pip.classList.toggle('on', i < left));
  if (fin && P.flashAt !== P.k + ':' + left) { P.flashAt = P.k + ':' + left; const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  const nx = nextEx(P.k), show = p.type === 'rest' ? nx : p;
  $('#pup').style.display = p.type === 'work' ? 'none' : '';
  $('#pup').textContent = p.type === 'rest' ? 'REST · UP NEXT' : 'UP NEXT';
  $('#pname').textContent = show ? show.step.n : 'Rest';
  $('#pside').textContent = [show && show.step.sd, show && show.step.r ? '×' + show.step.r : ''].filter(Boolean).join(' · ');
  const pics = show ? imgsOf(show.r, show.step) : [], img = $('#pimg');
  if (pics.length) {                     // two catalogue photos (start/end position) alternate once a second
    const src = pics[Math.floor(performance.now() / 1000) % pics.length];
    if (img.getAttribute('src') !== src) img.src = src;
    img.style.display = ''; $('#pnoimg').style.display = 'none';
  } else { img.style.display = 'none'; $('#pnoimg').style.display = ''; }
  const yt = $('#pyt'); yt.href = show ? ytAt(show.r, show.step) : r.url;
  $('#pcue').textContent = show && show.step.c ? show.step.c : '';
  const after = p.type === 'work' ? nx : show ? nextEx(P.ph.indexOf(show)) : null;
  $('#pnext').style.visibility = after ? 'visible' : 'hidden';
  if (after) { $('#pnext .k').textContent = p.type === 'work' ? 'NEXT' : 'THEN'; $('#pnn').textContent = after.step.n + (after.step.sd ? ` (${after.step.sd})` : '');
    $('#pnd').textContent = after.step.r ? '×' + after.step.r : after.step.w + 's'; }
  drawPlayBtn();
}
function drawPlayBtn() {
  const b = $('#bt'); if (!b) return;
  const want = P.running ? 'pause' : 'play';
  if (b.dataset.st !== want) { b.dataset.st = want; b.innerHTML = ic(want, 36); b.setAttribute('aria-label', P.running ? 'Pause' : 'Play'); }
  b.disabled = P.done;
}
document.addEventListener('keydown', e => {
  if (!P) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') jump(1); else if (e.key === 'ArrowLeft') jump(-1);
  else if (e.key === 'Escape') exitPlayer();
});
document.addEventListener('visibilitychange', () => {                  // back on screen: resync the UI, re-take the wake lock
  if (document.visibilityState !== 'visible' || !P) return;
  if (P.mode === 'web' && P.running && actx && actx.state !== 'running') audioCtx();
  frame(); if (P.running) lockScreen(true);
});

/* ---------- routing (hash, so Android back closes the sheet / leaves the timer / returns to the list) ---------- */
let lastRoute = '';
function route() {
  const h = location.hash.slice(1) || '/';
  const m = h.match(/^\/(r|play)\/(.+)$/);
  if (!m || m[1] !== 'play') stopPlayer();
  const isSheet = /^\/filters/.test(h);
  if (!isSheet) $('#layer').innerHTML = '';
  if (isSheet) {
    sheetPushed = lastRoute === '/' || lastRoute === '';
    if (!$('#libhead')) library();
    sheet(h === '/filters/gear');
  } else if (!m) { library(); if (/^\/r\//.test(lastRoute) && rememberedScroll) window.scrollTo(0, rememberedScroll); }
  else if (m[1] === 'r') { if (lastRoute === '/' || /^\/filters/.test(lastRoute)) { cameFromList = true; rememberedScroll = window.scrollY; } else if (!/^\/play/.test(lastRoute)) cameFromList = false;
    detail(decodeURIComponent(m[2])); }
  else { const ids = decodeURIComponent(m[2]).split('+'); if (!byId[ids[0]]) { location.hash = '#/'; return; } play(ids); }
  if (m) libShellTab = null;            // the class page / timer replaced the list: rebuild it on the way back
  lastRoute = h;
}
let rememberedScroll = 0;
window.addEventListener('hashchange', route);
route();

/* installable app (Android: Add to home screen) + offline: only when served over http(s) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
